const status=()=>'';

function renderDiscover(){return frame(`${header()}<div class="hero"><h1 class="serif">Better conversations start here.</h1><p>Curated ideas, games and collections to help you say more, naturally.</p><button class="cream-pill" data-action="random">${icon('magic-star','✦','iconsmall')} Random idea ${icon('arrow-right','→','iconsmall')}</button></div>${section('Questions That Get People Talking',`<div class="hscroll">${featuredIdeas.map(o=>card(o,'','featured')).join('')}</div>`,'featured','Explore')}${section('Explore Nigerian life',`<div class="topic-strip">${subtopics.slice(0,9).map(t=>`<button class="topic-chip" data-action="open-subtopic" data-id="${t.id}">${icon(topicIcon[t.id]||'layers','','iconsmall')} ${esc(t.name)}</button>`).join('')}</div>`,'nav-subtopics','See all')}${section('Collections',`<div class="hscroll">${collections.map(tile).join('')}</div>`,'all-collections')}${section('Games',`<div class="hscroll">${gameDefs.map(g=>gameTile(g)).join('')}</div>`,'nav-games')}${section('Explore a vibe',`<div class="filter-bar">${['Playful','Deep','Curious','Bold','Relaxed'].map(v=>`<button class="chip" data-action="vibe" data-vibe="${v}">${v}</button>`).join('')}</div>`)}<div class="spacer"></div>`)}

function renderCollection(){let c=collection(state.collection)||collections[0],subset=ideas.filter(i=>i.collection===c.id);return frame(`<div class="collection-hero" data-symbol="${esc(c.symbol)}" style="background:radial-gradient(circle at 86% 23%,#e6b57637,transparent 46%),linear-gradient(135deg,${heroTints[c.color]||'#40323b'},#101618)">${status()}<button class="backbtn" data-action="nav" data-page="discover" aria-label="Back to Discover">${icon('arrow-left','←')}</button><h1>${esc(c.name)}</h1><div class="meta">${subset.length} ideas · ${esc(c.vibe)}</div><p>${esc(c.desc)}</p><button class="cream-pill" data-action="start-collection" data-id="${c.id}"><span>${icon('play','▶','iconsmall')} &nbsp; Start Exploring</span>${icon('arrow-right','→','iconsmall')}</button></div><div class="stack-list"><h2>Conversation Ideas</h2><p style="opacity:.75;font-size:12px;margin:-2px 0 15px">${c.id==='gist'?'500 Nigerian-first conversation starters · For texts, calls and in-person gist · Editorial preview':'Nigerian-first editorial preview · 500 working draft ideas per collection · Pending editorial approval'}</p>${subset.map(o=>card(o,'inlist')).join('')}</div>`,false,false)}
function renderFeaturedDetail(){return frame(`<div class="collection-hero" data-symbol="✦" style="background:radial-gradient(circle at 86% 23%,#e6b5763b,transparent 46%),linear-gradient(135deg,#3b3d36,#101618)">${status()}<button class="backbtn" data-action="nav" data-page="discover" aria-label="Back to Discover">${icon('arrow-left','←')}</button><h1>Questions That Get People Talking</h1><div class="meta">${featuredIdeas.length} selected ideas · Rotating picks</div><p>Easy-to-bring-up questions selected from across our collections. Find something interesting to say right now.</p><button class="cream-pill" data-action="start-featured"><span>${icon('play','▶','iconsmall')} &nbsp; Start Exploring</span>${icon('arrow-right','→','iconsmall')}</button></div><div class="stack-list"><h2>Today's Picks</h2>${featuredIdeas.map(o=>card(o,'inlist','featured')).join('')}</div>`,false,false)}
function renderGames(){return frame(`${header()}<div class="pagehead" style="padding-top:32px"><div><h1>Conversation<br>Games</h1><p>3,500 Nigerian-first game cards across six experiences. Working editorial preview.</p></div></div><div class="gamegrid">${gameDefs.map(g=>gameTile(g,true)).join('')}</div>`)}

function renderGameDetail(){let g=game(state.game)||gameDefs[0],list=gameItems.filter(i=>i.game===g.id&&(g.id!=='truthdare'||i.kind===state.gameTab));return frame(`<div class="collection-hero" style="background:radial-gradient(circle at 87% 22%,#d75d5666,transparent 49%),linear-gradient(135deg,#54212f,#111618)">${status()}<button class="backbtn" data-action="nav" data-page="games" aria-label="Back to Games">${icon('arrow-left','←')}</button><h1>${esc(g.name)}</h1><div class="meta">${list.length} cards · Playful · Unexpected</div><p>${esc(g.desc)}</p>${g.id==='truthdare'?`<div class="focus-group" style="justify-content:flex-start;margin:0 0 16px">${tabTruthDare()}</div>`:''}<button class="cream-pill" data-action="start-game" data-id="${g.id}"><span>${icon('play','▶','iconsmall')} &nbsp; Start Playing</span>${icon('arrow-right','→','iconsmall')}</button></div><div class="stack-list"><h2>${g.id==='truthdare'?state.gameTab+' Cards':'Game Cards'}</h2>${list.slice(0,state.gameVisible||24).map(o=>card(o,'inlist')).join('')}</div>${list.length>(state.gameVisible||24)?`<div style="padding:0 24px 36px;text-align:center"><button class="cream-pill" data-action="load-more-game">Show more (${Math.min(list.length,state.gameVisible||24)} of ${list.length})</button></div>`:''}`,false,false)}
function getFocusItem(){let id=state.focusIds[state.focusIndex];return item(id)||ideas[0]}
function renderFocus(){let o=getFocusItem(),source=state.focusSource,title=source?.type==='collection'?collection(source.id)?.name:source?.type==='game'?game(source.id)?.name:source?.type==='subtopic'?subtopic(source.id)?.name:source?.type==='featured'?'Questions That Get People Talking':source?.type==='saved'?'Saved':'Random Discovery';let gameTD=source?.type==='game'&&source?.id==='truthdare';return `<div class="focuspage">${status()}<div class="focus-top"><div class="focus-toptitle"><button class="backbtn" data-action="focus-back" aria-label="Return to previous page">${icon('arrow-left','←')}</button><span class="focus-sub">${esc(title)}</span></div><span class="focus-sub">${state.focusIndex+1}/${state.focusIds.length}</span></div>${gameTD?`<div class="focus-group">${tabTruthDare()}</div>`:''}<div class="focus-area" id="focus-swipe-area" aria-label="Swipe left or right to change card"><div class="deck-stack" id="card-stack"><article class="focus-front" style="${styleColor(o.color)}"><div class="smalltop"><span>${esc(gameTD?'Truth or Dare':title)}</span><span>${state.focusIndex+1}/${state.focusIds.length}</span></div><h1 class="prompt">${esc(o.text)}</h1><div class="smallbottom">${esc(o.kind)}</div></article></div></div><div class="swipe-hint">Swipe to discover another idea</div><div class="focus-actions"><button class="action" data-action="focus-back"><span class="round-btn">${icon('arrow-left','←')}</span>Back</button><button class="action ${state.saved.includes(o.id)?'active':''}" data-action="toggle-save" data-id="${o.id}"><span class="round-btn">${icon('bookmark','♧')}</span>${state.saved.includes(o.id)?'Saved':'Save'}</button><button class="action" data-action="copy" data-id="${o.id}"><span class="round-btn">${icon('copy','▣')}</span>Copy</button><button class="action" data-action="next"><span class="round-btn">${icon('arrow-right','→')}</span>Next</button></div></div>`;}
function renderSaved(){let list=state.saved.map(item).filter(Boolean).filter(o=>state.savedFilter==='All'||(state.savedFilter==='Ideas'?!o.isGame:o.isGame));return frame(`${header()}<div class="pagehead"><div><h1>Saved</h1><p>Your favourite conversation ideas and games, all in one place.</p></div></div><div class="filter-bar">${['All','Ideas','Games'].map(x=>`<button class="chip ${state.savedFilter===x?'sel':''}" data-action="saved-filter" data-filter="${x}">${x}</button>`).join('')}</div>${legacyNotice("saved")}${list.length?`<div class="savedgrid">${list.map(o=>card(o)).join('')}</div>`:`<div class="empty"><div class="illustration"></div><h2>Keep the good ones.</h2><p>When something catches your attention, save it and come back whenever you like.</p><button class="cream-pill" data-action="nav" data-page="discover">Explore ideas ${icon('arrow-right','→','iconsmall')}</button></div>`}`)}
function renderHistory(){let list=state.history.map(item).filter(Boolean);return frame(`${header()}<div class="pagehead"><div><h1>History</h1><p>Interesting things you’ve recently discovered.</p></div></div>${legacyNotice("history")}${list.length?`<div class="history-list"><h3>Recently viewed</h3>${list.map(o=>`<button class="history-item" data-action="open-card" data-id="${o.id}"><span class="thumb" style="${styleColor(o.color)}">${o.isGame?'♟':'✦'}</span><span class="text">${esc(o.text)}<small class="date">${esc(o.isGame?game(o.game)?.name:collection(o.collection)?.name)} · ${esc(o.kind)}</small></span><span class="arrow">${icon('arrow-right','','iconsmall')}</span></button>`).join('')}</div>`:`<div class="empty"><div class="illustration"></div><h2>Your discoveries live here.</h2><p>As you explore cards, we’ll keep a recent history so you can find them again.</p><button class="cream-pill" data-action="nav" data-page="discover">Start discovering ${icon('arrow-right','→','iconsmall')}</button></div>`}`)}
const settingsRows=[['account','Account','Local-first · No sign-in required','profile-circle','◉'],['context','Conversation context','Texting, on a call, in person','message-text','☏'],['appearance','Appearance','Theme and display options','moon','☾'],['mature','Mature content','Unavailable until verified','shield-tick','◇'],['privacy','Privacy & local data','Manage this prototype’s data','lock','▢'],['about','About Say More','Vision and prototype information','info-circle','ⓘ']];
function renderSettings(){return frame(`${header()}<div class="pagehead"><div><h1>Settings</h1><p>Make the experience yours, without getting in the way.</p></div></div><div class="settings-list">${settingsRows.map(r=>`<button class="setting-row" data-action="nav" data-page="${r[0]}"><span class="set-ico">${icon(r[3],r[4])}</span><span class="setcopy"><strong>${r[1]}</strong><small>${r[2]}</small></span><span class="chev">${icon('arrow-right','','iconsmall')}</span></button>`).join('')}</div><div class="settings-list" style="margin-top:13px;padding:15px"><p style="font-size:12px;line-height:1.6;opacity:.83;margin:0">Earlier saved items and history are still in the classic Say More app. <a href="/classic/" style="text-decoration:underline">Open classic Say More</a>.</p></div>`,false)}
function subpage(title,body){return frame(`<div class="setting-header"><button class="backbtn" data-action="nav" data-page="settings">${icon('arrow-left','←')}</button><h1>${esc(title)}</h1></div>${body}`,false)}
function renderSubpage(){switch(state.page){
case 'context':return subpage('Conversation context',`<div class="pref-label">Where are you talking?</div><div class="pref-box"><strong style="font-size:13px">Your situation (optional)</strong><p>Use the same ideas, with wording suited to your conversation.</p><div class="prefs">${['Any situation','Texting','On a call','In person'].map(x=>`<button class="chip ${state.context===x?'sel':''}" data-action="context" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><div class="pref-label">Who are you talking to?</div><div class="pref-box"><strong style="font-size:13px">Your audience (optional)</strong><p>This setting is a UX demonstration; content variants need an editorial review before implementation.</p><div class="prefs">${['Anyone','Someone new','Friend','Crush','Partner','Family','Group'].map(x=>`<button class="chip ${state.audience===x?'sel':''}" data-action="audience" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><p class="inline-help">No preferences are required to browse or play.</p>`);
case 'appearance':return subpage('Appearance',`<div class="pref-label">Theme</div><div class="pref-box"><strong style="font-size:13px">Choose your look</strong><div class="prefs">${[['dark','Dark'],['light','Light']].map(([v,n])=>`<button class="chip ${state.theme===v?'sel':''}" data-action="theme" data-value="${v}">${n}</button>`).join('')}</div></div><p class="inline-help">Dark is the approved primary visual direction. Light is an optional prototype variation.</p>`);
case 'account':return subpage('Your data',`<div class="pref-box"><strong>No account is required</strong><p>Saved cards and history are stored on this device. Cross-device account sync is not available yet, so there is no sign-in or email collection.</p><p>You can export your data from Privacy & local data.</p></div>`);
case 'mature':return subpage('Mature content',`<div class="pref-box"><strong>18+ content is currently unavailable</strong><p>All active cards use the everyday catalogue. Mature content will remain disabled until real age checks and separate content access are implemented and reviewed. No demo toggle can unlock it.</p></div>`);
case 'privacy':return subpage('Privacy & local data',`<div class="pref-box"><strong>Your data stays on this browser</strong><p>Saved cards and history remain on this device. Earlier classic data is backed up without changing the original records. No account or backend sync is connected.</p></div><div style="padding:9px 24px"><button class="muted-pill btn-wide" data-action="export-data">Export my local data (JSON)</button><div class="spacer"></div><button class="muted-pill btn-wide" data-action="clear-history">Clear browsing history</button><div class="spacer"></div><button class="muted-pill btn-wide danger" data-action="clear-all">Reset prototype data</button></div>`);
default:return subpage('About Say More',`<div style="text-align:center;padding:42px 24px"><div class="wordmark" style="font-size:44px">say more<i>.</i></div><h2 class="serif" style="font-size:32px;margin:27px 0 14px">Better conversations start here.</h2><p class="helper">A private conversation companion built to help people find interesting things to say on calls, over text or in person.</p><p class="notice">Say More · Nigerian-first conversations, wherever you are.</p></div>`);
}}
function renderOnboard(){let steps=[{title:'Better conversations start here.',desc:'Find interesting things to talk about, whenever the conversation needs a spark.',text:'Interesting conversations are a swipe away.',color:'rose'},{title:'Discover something unexpected.',desc:'Explore colourful collections of questions, opinions, stories and ideas.',text:'What’s a thought you’ve never said out loud?',color:'coral'},{title:'Pick it up. Keep talking.',desc:'Swipe for another idea, save the good ones, or copy one into your conversation.',text:'Good conversations lead to great connections.',color:'yellow'}],s=steps[state.obStep];return `<div class="onboard">${status()}<div class="top"><div class="wordmark">say more<i>.</i></div><button class="skip" data-action="finish-onboard">Skip</button></div><div class="obmain"><h1>${esc(s.title)}</h1><p>${esc(s.desc)}</p><div class="obdeck"><div class="obcard" style="background:${colors[s.color].tile}"><span>${esc(s.text)}</span></div></div></div><div class="obbottom"><div class="dots">${steps.map((_,i)=>`<span class="${i===state.obStep?'on':''}"></span>`).join('')}</div><button class="cream-pill" data-action="next-onboard">${state.obStep===2?'Start Exploring':'Next'} ${icon('arrow-right','→','iconsmall')}</button></div></div>`;}
function modalMarkup(){if(!state.modal)return '';let m=state.modal;return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-box"><h2 id="modal-title">${esc(m.title)}</h2><p>${esc(m.message)}</p>${m.kind==='age'?`<label for="birthdate" class="small-label">Your date of birth</label><input class="form-input" type="date" id="birthdate" aria-label="Your date of birth">`:''}<div class="modal-actions"><button class="muted-pill" data-action="close-modal">Cancel</button><button class="cream-pill" data-action="${m.kind==='age'?'confirm-age':m.kind==='clear-all'?'confirm-clear-all':m.kind==='clear-history'?'confirm-clear-history':'close-modal'}">${m.kind==='age'?'Continue':m.kind?.startsWith('clear')?'Clear':'OK'}</button></div></div></div>`;}
function render(){let html=state.onboard?renderOnboard():state.page==='focus'?renderFocus():state.page==='discover'?renderDiscover():state.page==='subtopics'?renderSubtopics():state.page==='subtopic'?renderSubtopicDetail():state.page==='collections'?renderAllCollections():state.page==='collection'?renderCollection():state.page==='featured-detail'?renderFeaturedDetail():state.page==='games'?renderGames():state.page==='game-detail'?renderGameDetail():state.page==='saved'?renderSaved():state.page==='history'?renderHistory():state.page==='settings'?renderSettings():renderSubpage();$('#screen').innerHTML=html+modalMarkup();document.querySelector('#screen .scroller')?.scrollTo(0,0);}
function nav(p){state.onboard=false;state.page=p;state.modal=null;saveStore();render()}
function showToast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function record(o){state.history=[o.id,...state.history.filter(x=>x!==o.id)].slice(0,100);saveStore()}
function startFocus(list,chosen=0,src,prev){if(!list.length){showToast('No cards in this deck yet');return}state.focusIds=list.map(x=>x.id);state.focusIndex=Math.max(0,chosen);state.focusSource=src;state.previous=prev||state.page;state.page='focus';record(getFocusItem());render()}
function focusBack(){state.page=state.previous||'discover';render()}
function moveFocus(n){if(!state.focusIds.length)return;state.focusIndex=(state.focusIndex+n+state.focusIds.length)%state.focusIds.length;record(getFocusItem());render()}
function getListForItem(o){if(o.isGame)return gameItems.filter(x=>x.game===o.game&&(o.game!=='truthdare'||x.kind===state.gameTab));if(state.page==='saved')return state.saved.map(item).filter(x=>x&&!x.isGame);if(state.page==='history')return state.history.map(item).filter(x=>x&&!x.isGame);if(state.page==='subtopic')return topicList(state.subtopic);if(state.page==='collection')return ideas.filter(x=>x.collection===state.collection);if(state.page==='featured-detail')return featuredIdeas;return ideas.filter(x=>x.collection===o.collection)}
function openCard(id){let o=item(id);if(!o)return; if(o.isGame){state.game=o.game;if(o.game==='truthdare')state.gameTab=o.kind}let list=getListForItem(o);let src=o.isGame?{type:'game',id:o.game}:state.page==='subtopic'?{type:'subtopic',id:state.subtopic}:state.page==='collection'?{type:'collection',id:state.collection}:state.page==='saved'?{type:'saved'}:state.page==='history'?{type:'history'}:{type:'collection',id:o.collection};startFocus(list,list.findIndex(x=>x.id===id),src)}
function changeGameTab(tab){state.gameTab=tab;state.gameVisible=24;if(state.page==='focus'){let list=gameItems.filter(x=>x.game==='truthdare'&&x.kind===tab);state.focusIds=list.map(x=>x.id);state.focusIndex=0;record(getFocusItem())}render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function copyCard(o){const value=typeof o==='string'?o:o?.text||'';try{await navigator.clipboard.writeText(value);showToast('Copied to clipboard')}catch{const ta=document.createElement('textarea');ta.value=value;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();showToast(ok?'Copied to clipboard':'Copy isn’t available in this browser')}}
function action(el){let a=el.dataset.action,id=el.dataset.id,p=el.dataset.page;switch(a){
case 'nav':nav(p);break;
case 'nav-games':nav('games');break;
case 'nav-subtopics':nav('subtopics');break;
case 'open-subtopic':state.subtopic=id;state.subtopicVisible=24;nav('subtopic');break;
case 'load-more-topic':{const y=$('#screen .scroller')?.scrollTop||0;state.subtopicVisible=(state.subtopicVisible||24)+24;render();$('#screen .scroller')?.scrollTo(0,y);break}
case 'start-subtopic':startFocus(topicList(id),0,{type:'subtopic',id},'subtopic');break;
case 'all-collections':nav('collections');break;
case 'featured':nav('featured-detail');break;
case 'start-featured':startFocus(featuredIdeas,0,{type:'featured'},'featured-detail');break;
case 'open-featured-card':{let idx=featuredIdeas.findIndex(x=>x.id===id);startFocus(featuredIdeas,idx<0?0:idx,{type:'featured'},state.page);break}
case 'random':startFocus(shuffle(ideas),0,{type:'random'},state.page);break;
case 'open-collection':state.collection=id;nav('collection');break;
case 'start-collection':startFocus(ideas.filter(o=>o.collection===id),0,{type:'collection',id},'collection');break;
case 'open-game':state.game=id;state.gameTab='Truth';state.gameVisible=24;nav('game-detail');break;
case 'start-game':startFocus(gameItems.filter(o=>o.game===id&&(id!=='truthdare'||o.kind===state.gameTab)),0,{type:'game',id},'game-detail');break;
case 'game-tab':changeGameTab(el.dataset.tab);break;
case 'load-more-game':{const y=$('#screen .scroller')?.scrollTop||0;state.gameVisible=(state.gameVisible||24)+24;render();$('#screen .scroller')?.scrollTo(0,y);break}
case 'open-card':openCard(id);break;
case 'focus-back':focusBack();break;
case 'next':moveFocus(1);break;
case 'prev':moveFocus(-1);break;
case 'toggle-save':{let idx=state.saved.indexOf(id);if(idx>=0)state.saved.splice(idx,1);else state.saved.unshift(id);saveStore();render();showToast(idx>=0?'Removed from Saved':'Added to Saved');break}
case 'copy':copyCard(item(id));break;
case 'saved-filter':state.savedFilter=el.dataset.filter;render();break;
case 'vibe':{let map={Playful:'random',Deep:'late',Curious:'know',Bold:'opinions',Relaxed:'stories'};state.collection=map[el.dataset.vibe];nav('collection');break}
case 'next-onboard':if(state.obStep===2){state.onboard=false;saveStore();render()}else{state.obStep++;render()}break;
case 'finish-onboard':state.onboard=false;saveStore();render();break;
case 'context':state.context=el.dataset.value;saveStore();render();showToast('Context saved');break;
case 'audience':state.audience=el.dataset.value;saveStore();render();showToast('Audience saved');break;
case 'theme':state.theme=el.dataset.value;document.documentElement.dataset.theme=state.theme;saveStore();render();break;
case 'toggle-18':state.age18=false;showToast('18+ content is not available');break;
case 'confirm-age':state.age18=false;state.modal=null;render();break;
case 'auth-demo':showToast('Sign-in is not available. Saved cards are stored locally.');break;
case 'export-data':{try{const snapshot=window.SayMoreMigration.exportData(localStorage),blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='say-more-local-data.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);showToast('Backup exported')}catch{showToast('Export unavailable on this browser')}break;}
case 'clear-history':state.modal={kind:'clear-history',title:'Clear browsing history?',message:'This removes recently viewed cards from this browser. Saved cards are not affected.'};render();break;
case 'clear-all':state.modal={kind:'clear-all',title:'Reset prototype data?',message:'This clears only the redesigned app’s data. Classic Say More saved cards and history will remain untouched.'};render();break;
case 'confirm-clear-history':state.history=[];state.modal=null;saveStore();render();showToast('History cleared');break;
case 'confirm-clear-all':window.SayMoreMigration.resetRC(localStorage);location.reload();break;
case 'close-modal':state.modal=null;render();break;
}}
$('#screen').addEventListener('input',e=>{if(e.target.id==='subtopic-search'){state.subtopicSearch=e.target.value;const target=$('#subtopic-results');if(target)target.innerHTML=renderTopicTiles(state.subtopicSearch)}});
$('#screen').addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el)action(el)});
let pointerStart=null;$('#screen').addEventListener('pointerdown',e=>{let area=e.target.closest('#focus-swipe-area');if(!area)return;pointerStart={x:e.clientX,y:e.clientY,t:Date.now()}});$('#screen').addEventListener('pointerup',e=>{if(!pointerStart)return;let dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;pointerStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.15){moveFocus(dx<0?1:-1)}});$('#screen').addEventListener('pointercancel',()=>pointerStart=null);
document.addEventListener('keydown',e=>{if(state.page==='focus'&&!state.modal){if(e.key==='ArrowRight'){e.preventDefault();moveFocus(1)}if(e.key==='ArrowLeft'){e.preventDefault();moveFocus(-1)}if(e.key==='Escape'){focusBack()}}});
render();
})();
</script>
<script>if('serviceWorker' in navigator && (location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});</script>
