function sorted(list){const key=JSON.stringify([state.view,state.mood,state.topic,state.audience,state.adult,state.query,list.map(p=>p.id).join('|')]);if(state.feedKey===key){const lookup=new Map(list.map(p=>[p.id,p]));return state.feedOrder.map(id=>lookup.get(id)).filter(Boolean)}const result=[...list].sort((a,b)=>{const va=state.seen.includes(a.id)?1:0,vb=state.seen.includes(b.id)?1:0;return va-vb || ((Number(a.id.replace(/[^0-9]/g,''))*17)%53)-((Number(b.id.replace(/[^0-9]/g,''))*17)%53)});state.feedKey=key;state.feedOrder=result.map(p=>p.id);return result}

async function requestAi(task){
 if(aiBusy)return;
 if(!aiAgeApproved){aiPendingTask=task;state.overlay='aiGate';renderOverlay();return;}
 if(state.adult){showToast('AI is unavailable in 18+ mode. Use curated prompts.');return;}
 const activeId=state.focus, selected=PROMPTS.find(p=>p.id===activeId);
 if(task==='angles'&&!selected)return;
 aiBusy=true;aiError='';aiStatus='Creating original conversation ideas…';
 if(task==='angles')renderOverlay();else render();
 try{
  const body={task,ageConfirmed:true,mood:state.mood==='All moods'?'Any':state.mood,topic:state.topic==='All topics'?'Any':state.topic,audience:state.audience,adult:false,recent:[...state.seen.slice(-8),...aiLatest].map(id=>PROMPTS.find(p=>p.id===id)?.text).filter(Boolean)};
  if(task==='angles'){body.prompt=selected.text;body.format=selected.format;body.topic=selected.topic;}
  const response=await fetch('/api/ai/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'AI generation is unavailable at present.');
  if(task==='angles'){
    if(state.focus===activeId&&data.angles?.length){aiAnglesById[activeId]=data.angles.slice(0,3);state.angles=true;renderOverlay();}
  }else{
    const added=[];
    for(const [i,p] of (data.prompts||[]).entries()){
      const id='a'+Date.now()+i;
      const safe={id,text:String(p.text||'').slice(0,260),topic:TOPICS.includes(p.topic)?p.topic:'Life',format:String(p.format||'Question'),moods:Array.isArray(p.moods)?p.moods:['Curious'],audiences:Array.isArray(p.audiences)?p.audiences:['Anyone'],angles:Array.isArray(p.angles)?p.angles.slice(0,2):[],adult:false,source:'ai'};
      PROMPTS.push(safe);added.push(id);
    }
    aiLatest=added;rememberAi();state.feedKey=null;aiStatus=`${added.length} new ideas ready. Gemini ${data.model==='gemini-3.6-flash'?'3.6':'AI'} suggestions.`;render();
    if(task==='surprise'&&added[0]){focus(added[0]);}else{requestAnimationFrame(()=>document.getElementById('ai-results')?.scrollIntoView({behavior:'smooth',block:'start'}));}
  }
 }catch(err){aiError=err.message||'Unable to generate ideas. Your curated prompts are still available.';if(task==='angles'){renderOverlay();showToast(aiError)}else{render();}}

}

function showToast(message){const root=document.getElementById('toaster');if(!root)return;root.innerHTML=`<div role="status" class="toast">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(root)root.innerHTML=''},2200)}

}
if(state.focus){const p=PROMPTS.find(x=>x.id===state.focus);if(!p||p.adult!==state.adult){state.focus=null;return}const idx=orderCache.indexOf(p.id),n=orderCache.length;root.innerHTML=`<div class="focus-overlay" role="dialog" aria-modal="true" aria-label="Focused conversation prompt"><div class="focus-window"><div class="focus-top"><div class="focus-label">FOCUS MODE · ${state.adult?'18+':'EVERYDAY'} CONVERSATIONS</div><button class="close" data-action="closeFocus" aria-label="Close focus">${icon('close')}</button></div><div class="focus-center"><div class="focus-kicker"><span>${icon('spark')}</span> ${esc(p.format)} · ${esc(p.topic)}</div><h2 class="focus-main">${esc(p.text)}</h2><div class="focus-actions"><button class="focus-action ${state.saved.includes(p.id)?'on':''}" data-save="${p.id}">${icon('heart')} ${state.saved.includes(p.id)?'Saved':'Save'}</button><button class="focus-action" data-action="angles">${icon('layers')} ${state.angles?'Hide angles':'More angles'}</button><button class="focus-action" data-hide="${p.id}">${icon('eyeoff')} Hide</button><button class="focus-action" data-action="copyPrompt">${icon('copy')} Copy</button></div>${state.angles?`<div class="angles"><h3>Keep this conversation going</h3>${p.angles.map(a=>`<div class="angle">${esc(a)}</div>`).join('')}${(aiAnglesById[p.id]||[]).map(a=>`<div class="angle ai-generated-angle"><span class="ai-tag">AI angle</span><div>${esc(a)}</div></div>`).join('')}${!p.adult?`<button class="ai-angle-button" type="button" data-action="aiAngles" ${aiBusy?'disabled':''}>${icon('sparkles')} ${aiBusy?'Thinking…':'Generate more angles'}</button>`:''}</div>`:''}</div><div class="focus-bottom"><div class="pagination">${idx>=0?`${idx+1} of ${n}`:'From collection'} <span class="mobile-only"> · Swipe with arrows</span></div><div class="nexts"><button aria-label="Previous prompt" data-action="prev" ${idx<=0?'disabled':''}>${icon('left')}</button><button aria-label="Next prompt" data-action="next" ${idx===n-1?'disabled':''}>${icon('arrow')}</button></div></div></div></div>`;return}
if(state.overlay==='refine'){root.innerHTML=`<div class="overlay" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Conversation filters"><div class="modal-head"><h2>Make your mix.</h2><button class="close" data-action="closeOverlay">${icon('close')}</button></div><div class="modal-body"><p style="color:#858D81;font-size:13px;line-height:1.5;margin:0">Select what fits your conversation. Every filter is optional.</p><div class="refine-label">YOUR MOOD</div><div class="choicegrid">${['All moods',...MOODS].map(v=>`<button class="choice ${state.mood===v?'on':''}" data-mood="${esc(v)}">${v}</button>`).join('')}</div><div class="refine-label">TOPIC</div><div class="choicegrid">${['All topics',...TOPICS].map(v=>`<button class="choice ${state.topic===v?'on':''}" data-topicfilter="${esc(v)}">${v}</button>`).join('')}</div><div class="refine-label">WHO YOU'RE TALKING TO</div><div class="choicegrid">${AUDIENCES.map(v=>`<button class="choice ${state.audience===v?'on':''}" data-audience="${esc(v)}">${v}</button>`).join('')}</div><div class="modal-actions"><button class="muted-button" data-action="clearFilters">Clear all</button><button class="primary" data-action="applyFilters">Show conversations ${icon('arrow')}</button></div></div></div></div>`;return}
if(state.overlay==='adultGate'){root.innerHTML=`<div class="overlay" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Adult content confirmation"><div class="modal-head"><h2>Before you enter.</h2><button class="close" data-action="closeOverlay">${icon('close')}</button></div><div class="modal-body"><div style="background:#EEE7EF;border-radius:16px;padding:18px;display:flex;gap:12px;align-items:start">${icon('lock')}<div><strong style="font-size:14px">This section is for adults aged 18 and over.</strong><p style="font-size:12px;line-height:1.6;color:#736A78;margin:8px 0 0">It includes frank discussions about attraction, intimacy, sexual preferences and relationship boundaries. The everyday feed remains separate.</p></div></div><button class="formcheck" type="button" style="width:100%;text-align:left" data-action="checkAdult"><span class="fakecheck ${state.confirmedAdult?'on':''}">${state.confirmedAdult?icon('check'):''}</span><span>I confirm I am 18 or older and want to enter the separate adult content area.</span></button><p class="tiny-note">This age confirmation demonstrates the proposed design flow. It is not a verified age check.</p><div class="modal-actions"><button class="muted-button" data-action="closeOverlay">Stay in everyday mode</button><button class="primary" ${!state.confirmedAdult?'disabled':''} data-action="confirmAdult">Enter 18+ ${icon('arrow')}</button></div></div></div></div>`;return}
if(state.overlay&&state.overlay.startsWith('confirm:')){const target=state.overlay.slice(8);const descriptions={clearHistory:'Delete your entire viewing history?',clearSaved:'Remove every prompt from Saved?',clearHidden:'Restore all prompts you previously hid?',clearGenerated:'Delete all locally stored AI-generated ideas?'};root.innerHTML=`<div class="overlay" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Confirm change"><div class="modal-head"><h2>Are you sure?</h2><button class="close" data-action="closeOverlay">${icon('close')}</button></div><div class="modal-body"><p style="color:#6C7469;font-size:14px;line-height:1.7">${descriptions[target]}</p><div class="modal-actions"><button class="secondary" data-action="closeOverlay">Keep as it is</button><button class="primary" data-action="do:${target}">Confirm ${icon('arrow')}</button></div></div></div></div>`;return}
root.innerHTML=''}
function focus(id){const p=PROMPTS.find(x=>x.id===id);if(!p||p.adult!==state.adult)return;if(!state.focus)focusOriginScroll=window.scrollY;state.focus=id;state.angles=false;state.seen=state.seen.filter(x=>x!==id).concat(id);persist();renderOverlay()}
function move(delta){let idx=orderCache.indexOf(state.focus);if(idx<0)return;let next=orderCache[idx+delta];if(next)focus(next)}
function nav(v){state.view=v;state.query='';state.overlay=null;state.focus=null;window.scrollTo({top:0,behavior:'instant'});render()}
function applyAction(a){if(a==='todNext'){const item=TOD_ITEMS.find(c=>c.id===todState.current);todDraw(item?.type||'Random');return}if(a==='todSkip'){const item=TOD_ITEMS.find(c=>c.id===todState.current);todDraw(item?.type||'Random');return}if(a==='todReset'){todReset();return}if(a==='todCopy'){const item=TOD_ITEMS.find(c=>c.id===todState.current);if(item&&navigator.clipboard?.writeText)navigator.clipboard.writeText(item.text).then(()=>showToast('Card copied')).catch(()=>showToast('Copy unavailable'));return}if(a==='retryLibrary'){void loadPublishedLibrary();return}if(a==='loadMore'){const currentScroll=window.scrollY;state.feedVisible+=48;render();if(state.matchCount<state.feedVisible+48&&remainingPublishedFiles().length)void loadNextPublishedFiles(8);requestAnimationFrame(()=>window.scrollTo(0,currentScroll));return}if(a==='toggleAI'){state.aiExpanded=!state.aiExpanded;render();return}if(a==='confirmAiAge'){aiAgeApproved=true;try{localStorage.setItem(AI_AGE_STORAGE,'yes')}catch{}state.overlay=null;renderOverlay();if(aiPendingTask){const task=aiPendingTask;aiPendingTask=null;requestAi(task)}return}if(a==='aiPrompts'){requestAi('prompts');return}if(a==='aiSurprise'){requestAi('surprise');return}if(a==='aiAngles'){requestAi('angles');return}if(a==='clearAiResults'){aiLatest=[];aiError='';aiStatus='';render();return}if(a==='refine'){state.overlay='refine';renderOverlay();return}if(a==='closeOverlay'){state.overlay=null;state.confirmedAdult=false;renderOverlay();return}if(a==='applyFilters'){state.overlay=null;nav('explore');return}if(a==='clearFilters'){state.feedVisible=48;state.mood='All moods';state.topic='All topics';state.audience='Anyone';state.query='';if(state.overlay==='refine')renderOverlay();else nav('explore');return}if(a==='closeFocus'){state.focus=null;render();requestAnimationFrame(()=>window.scrollTo(0,focusOriginScroll));return}if(a==='angles'){state.angles=!state.angles;renderOverlay();return}if(a==='prev'||a==='next'){move(a==='prev'?-1:1);return}if(a==='surprise'){let pool=sorted(filtered());if(!pool.length)pool=sorted(inPool());if(!pool.length)return;const unseen=pool.filter(p=>!state.seen.includes(p.id));const from=unseen.length?unseen:pool;const p=from[Math.floor(Math.random()*from.length)];orderCache=pool.map(p=>p.id);focus(p.id);return}if(a==='enterAdult'){state.overlay='adultGate';state.confirmedAdult=false;renderOverlay();return}if(a==='checkAdult'){state.confirmedAdult=!state.confirmedAdult;renderOverlay();return}if(a==='confirmAdult'&&state.confirmedAdult){state.adult=true;state.adultUnlocked=true;state.overlay=null;state.query='';state.topic='All topics';state.mood='All moods';state.audience='Anyone';todState.current=null;nav(state.view==='truthordare'?'truthordare':'explore');return}if(a==='leaveAdult'){state.adult=false;state.focus=null;state.overlay=null;state.mood='All moods';state.topic='All topics';state.audience='Anyone';state.query='';todState.current=null;nav(state.view==='truthordare'?'truthordare':'explore');return}if(a==='toggleLarge'){state.large=!state.large;persist();render();return}if(a==='toggleCompact'){state.compact=!state.compact;persist();render();return}if(['clearHistory','clearSaved','clearHidden','clearGenerated'].includes(a)){state.overlay='confirm:'+a;renderOverlay();return}if(a.startsWith('do:')){let target=a.slice(3);if(target==='clearHistory')state.seen=[];if(target==='clearSaved')state.saved=[];if(target==='clearHidden')state.hidden=[];if(target==='clearGenerated'){const aiIds=new Set(PROMPTS.filter(p=>p.source==='ai').map(p=>p.id));for(let i=PROMPTS.length-1;i>=0;i--){if(PROMPTS[i].source==='ai')PROMPTS.splice(i,1)}state.saved=state.saved.filter(id=>!aiIds.has(id));state.seen=state.seen.filter(id=>!aiIds.has(id));state.hidden=state.hidden.filter(id=>!aiIds.has(id));aiLatest=[];aiAnglesById={};try{localStorage.removeItem(AI_STORAGE)}catch{}state.feedKey=null;}persist();state.overlay=null;render();showToast('Your preferences have been updated');return}if(a==='copyPrompt'&&state.focus){let p=PROMPTS.find(p=>p.id===state.focus);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(p.text).then(()=>showToast('Prompt copied')).catch(()=>showToast('Copy unavailable in this browser'))}else showToast('Copy unavailable in this browser');return}}
document.addEventListener('click',e=>{let button=e.target.closest('[data-view],[data-focus],[data-save],[data-hide],[data-mood],[data-topic],[data-topicfilter],[data-audience],[data-tod-medium],[data-tod-audience],[data-tod-level],[data-tod-type],[data-action],[data-dismiss]');if(!button)return;const d=button.dataset;if(d.dismiss&&button===e.target){state.overlay=null;renderOverlay();return}if(d.view){nav(d.view);return}if(d.todMedium){todState.medium=d.todMedium;todReset();return}if(d.todAudience){todState.audience=d.todAudience;todReset();return}if(d.todLevel){todState.level=d.todLevel;todReset();return}if(d.todType){todDraw(d.todType);return}if(d.focus){focus(d.focus);return}if(d.save){const id=d.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();if(state.focus)renderOverlay();else render();showToast(state.saved.includes(id)?'Saved for later':'Removed from Saved');return}if(d.hide){state.hidden.push(d.hide);state.focus=null;persist();render();showToast('Prompt hidden from your feed');return}if(d.mood){state.feedVisible=48;state.mood=d.mood;if(state.overlay==='refine')renderOverlay();else render();return}if(d.topicfilter){state.feedVisible=48;state.topic=d.topicfilter;renderOverlay();return}if(d.topic){state.feedVisible=48;state.topic=d.topic;nav('explore');return}if(d.audience){state.feedVisible=48;state.audience=d.audience;renderOverlay();return}if(d.action){applyAction(d.action);return}});
