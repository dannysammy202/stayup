name: Nigeria 750 Audit

on:
  push:
    branches:
      - nigeria-editorial-750

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-nigeria-750.mjs
      - run: npm install --no-audit --no-fund
      - run: npx vite build
