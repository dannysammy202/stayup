name: Content Audit

on:
  push:
    branches:
      - content-rebuild-1000

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-authored-modules.mjs
      - run: node scripts/audit-new-games-1000.mjs
