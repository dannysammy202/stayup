name: Say More QA
on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'content/**'
      - 'package.json'
      - '.github/workflows/saymore-qa.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9d # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
