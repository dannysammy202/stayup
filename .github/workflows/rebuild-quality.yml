name: StayUp release quality

on:
  push:
    branches:
      - main
      - rebuild/**
      - content/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit live source integrity
        run: npm run audit:structure

      - name: Audit exact editorial targets
        run: npm run audit:content

      - name: Build production bundle
        run: npm run build
