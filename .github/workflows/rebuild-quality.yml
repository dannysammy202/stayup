name: StayUp rebuild quality

on:
  push:
    branches:
      - main
      - rebuild/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Audit live source integrity
        run: npm run audit:structure

      - name: Build production bundle
        run: npm run build

      - name: Report editorial target coverage
        continue-on-error: true
        run: npm run audit:content
