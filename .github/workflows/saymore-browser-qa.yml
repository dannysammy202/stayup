name: Say More Browser Release QA
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/conversation-browser-qa.mjs'
      - 'tests/**'
      - '.github/workflows/saymore-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-responsive-and-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser automation dependency
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify Chrome executable
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Exercise mobile tablet desktop and offline PWA
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs > /tmp/saymore-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/version.json > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/version.json
          CHROME_BIN="$(command -v google-chrome)" BASE_URL="http://127.0.0.1:4173" node scripts/conversation-browser-qa.mjs
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saymore-browser-release-qa
          path: |
            /tmp/saymore-conversation-browser-qa.json
            /tmp/saymore-approved-*.jpg
          if-no-files-found: ignore
